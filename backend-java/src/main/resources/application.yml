server:
  port: ${PORT:8000}

app:
  database-url: ${DATABASE_URL:postgresql+psycopg://dlx_user:change_me@localhost:5432/dlx_yuki_wms}
  business-timezone: ${BUSINESS_TIMEZONE:America/Los_Angeles}
  jwt:
    secret-key: ${JWT_SECRET_KEY:development-only-change-me-32-chars}
    algorithm: ${JWT_ALGORITHM:HS256}
    access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${REFRESH_TOKEN_EXPIRE_DAYS:7}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  jackson:
    property-naming-strategy: SNAKE_CASE

logging:
  level:
    org.springframework.security: INFO
